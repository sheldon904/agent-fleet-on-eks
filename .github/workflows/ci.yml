name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go (notify-bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notify-bridge-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  python:
    name: python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [governance-mcp, scheduler, ticket-to-pr-runner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v
        working-directory: services/${{ matrix.service }}

  e2e:
    name: e2e pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/e2e_local.py

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - name: validate
        working-directory: terraform/envs/dev
        run: |
          terraform init -backend=false
          terraform validate

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/agent-fleet
      - name: render
        run: helm template agent-fleet charts/agent-fleet -n agent-fleet > rendered.yaml
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas -summary rendered.yaml

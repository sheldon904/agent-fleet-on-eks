{{- range $name, $svc := .Values.services }}
{{- if ne $svc.enabled false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: agent-fleet
spec:
  replicas: {{ default 1 $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: agent-fleet
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ with $.Values.image.registry }}{{ . }}/{{ end }}{{ $svc.image }}:{{ default "latest" $svc.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ default 8080 $svc.port }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $s := $svc.secrets }}
            {{- if $s.envFileKey }}
            - name: {{ $s.envFileKey }}
              value: {{ printf "/secrets/%s" $s.fileName | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ default 8080 $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ default 8080 $svc.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml (default $.Values.defaultResources $svc.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if or $svc.secrets $svc.writableData }}
          volumeMounts:
            {{- if $svc.secrets }}
            - name: secrets
              mountPath: /secrets
              readOnly: true
            {{- end }}
            {{- with $svc.writableData }}
            - name: data
              mountPath: {{ . }}
            {{- end }}
          {{- end }}
      {{- if or $svc.secrets $svc.writableData }}
      volumes:
        {{- if $svc.secrets }}
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $name }}-spc
        {{- end }}
        {{- with $svc.writableData }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
